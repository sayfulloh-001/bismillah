services:
  # Web Application, Backend API & Telegram Bot (Combined Node.js + Python Bot)
  - type: web
    name: creator-web-app
    env: node
    plan: free
    buildCommand: npm install && npm run build && (pip3 install -r requirements.txt || pip install -r requirements.txt)
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
